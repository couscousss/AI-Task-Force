name: Deploy

# Deploys from GitHub's machines, so nothing has to be installed on your own computer.
#
# One-time setup, all in the browser:
#   1. Cloudflare dashboard -> My Profile -> API Tokens -> Create Token
#        -> "Edit Cloudflare Workers" template
#        -> add the "D1: Edit" permission as well
#      Copy the token.
#   2. This repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#        Name:  CLOUDFLARE_API_TOKEN     Value: the token you just copied
#        Name:  CLOUDFLARE_ACCOUNT_ID    Value: the Account ID from your Cloudflare
#                                               dashboard sidebar
#   3. This repo -> Actions -> Deploy -> Run workflow
#
# After that, every run redeploys. The URL is printed in the summary at the end.

on:
  workflow_dispatch:

# Two deploys at once would race on the database id, so let one finish first.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the secrets are set
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "The steps are in the comment at the top of .github/workflows/deploy.yml."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Catch a broken build here rather than after it is live.
      - name: Check types and run the solver tests
        run: |
          npm run typecheck
          npm test

      - name: Create or find the database
        run: node scripts/provision-d1.mjs

      - name: Apply the schema
        run: npx wrangler d1 migrations apply secc-builder-day --remote

      - name: Deploy
        id: deploy
        run: |
          npm run deploy 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          url="${{ steps.deploy.outputs.url }}"
          {
            echo "## Deployed"
            echo
            if [ -n "$url" ]; then
              echo "**Share this link with your department:** $url"
              echo
              echo "Organizer dashboard: $url/admin"
              echo "Published teams:     $url/teams"
            else
              echo "Deployed, but the URL was not in the log — check the Deploy step above."
            fi
            echo
            echo "### Before you share it"
            echo
            echo "Put Cloudflare Access in front of \`/admin\`, or your dashboard is open to"
            echo "anyone with the URL. Zero Trust -> Access -> Applications -> Add ->"
            echo "Self-hosted; path \`admin\`; policy Allow -> Emails -> the organizers."
            echo "Leave \`/join\` and \`/teams\` open — that is the point of them."
          } >> "$GITHUB_STEP_SUMMARY"
